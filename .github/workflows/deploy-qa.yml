name: Deploy QA

on:
  push:
    branches:
      - qa

jobs:
  deploy-qa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_VM_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.GCP_VM_PORT }} ${{ secrets.GCP_VM_HOST }} >> ~/.ssh/known_hosts

      - name: Prepare env file
        run: |
          echo "${{ secrets.QA_FRONTEND_ENV }}" > .env.qa

      - name: Upload project to VM
        run: |
          ssh -p ${{ secrets.GCP_VM_PORT }} ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_HOST }} "mkdir -p ${{ secrets.QA_FRONTEND_DEPLOY_PATH }}"

          rsync -az --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            --exclude "dist" \
            --exclude ".env" \
            --exclude ".env.local" \
            -e "ssh -p ${{ secrets.GCP_VM_PORT }}" \
            ./ ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_HOST }}:${{ secrets.QA_FRONTEND_DEPLOY_PATH }}/

      - name: Deploy QA frontend
        run: |
          ssh -p ${{ secrets.GCP_VM_PORT }} ${{ secrets.GCP_VM_USER }}@${{ secrets.GCP_VM_HOST }} << 'EOF'
            set -e

            cd ${{ secrets.QA_FRONTEND_DEPLOY_PATH }}

            cp .env.qa .env

            if docker compose version >/dev/null 2>&1; then
              COMPOSE="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE="docker-compose"
            else
              echo "Docker Compose no está disponible en la VM."
              exit 1
            fi

            $COMPOSE -f docker-compose.qa.yml down
            $COMPOSE -f docker-compose.qa.yml up -d --build

            docker image prune -f
          EOF